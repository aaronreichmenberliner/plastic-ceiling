    <linearGradient id="grad-key-inputs" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0000" stop-color="#e67e22"/><stop offset="0.1667" stop-color="#e67e22"/><stop offset="0.1667" stop-color="#b23b2e"/><stop offset="0.3333" stop-color="#b23b2e"/><stop offset="0.3333" stop-color="#eac21c"/><stop offset="0.5000" stop-color="#eac21c"/><stop offset="0.5000" stop-color="#4a97cc"/><stop offset="0.6667" stop-color="#4a97cc"/><stop offset="0.6667" stop-color="#7ecca0"/><stop offset="0.8333" stop-color="#7ecca0"/><stop offset="0.8333" stop-color="#7b2d1a"/><stop offset="1.0000" stop-color="#7b2d1a"/></linearGradient>
    <linearGradient id="grad-key-organisms" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0000" stop-color="#cc5d28"/><stop offset="0.2000" stop-color="#cc5d28"/><stop offset="0.2000" stop-color="#1b9e77"/><stop offset="0.4000" stop-color="#1b9e77"/><stop offset="0.4000" stop-color="#4a97cc"/><stop offset="0.6000" stop-color="#4a97cc"/><stop offset="0.6000" stop-color="#3a2e80"/><stop offset="0.8000" stop-color="#3a2e80"/><stop offset="0.8000" stop-color="#1c6091"/><stop offset="1.0000" stop-color="#1c6091"/></linearGradient>
