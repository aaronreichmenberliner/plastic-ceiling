<svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="fig2a-bpsf-flowchart"
     width="180.0mm" height="147.5576mm"
     viewBox="404.78 237.67 1627.14 1333.87"
     role="img" aria-labelledby="fig2a-title fig2a-desc">
  <title id="fig2a-title">Bio-physicochemical waste-to-product routes for crewed spaceflight</title>
  <desc id="fig2a-desc">Panel a: waste streams (left) routed through physicochemical and biological conversion units to microbial producer organisms (right). Line colour denotes the transferred carbon species; black lines denote bulk solid and slurry streams of unresolved composition; dashed lines denote streams routed past the adjacent conversion unit.</desc>
  <style type="text/css">
    text        { font-family: Arial, Helvetica, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; }
    .node-label { font-size: 38px; text-anchor: middle; }
    .key-label  { font-size: 32px; font-weight: bold; }
    .on-dark    { fill: #d8d8d8; }
    .feedstock, .bypass { stroke: #000000; }
    .co2      { stroke: #4a97cc; }
    .vfas     { stroke: #1b9e77; }
    .monomers { stroke: #cc5d28; }
    .ch4      { stroke: #3a2e80; }
    .co       { stroke: #1c6091; }
    .dashed   { stroke-dasharray: 36 30; }
    .unit     { stroke-width: 4.5; }
    .shape    { stroke: #000000; stroke-width: 2; }
    .key      { stroke: #000000; stroke-width: 2; }
  </style>
